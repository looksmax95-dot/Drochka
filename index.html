<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Моя галерея</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f13; color: #fff; font-family: system-ui, sans-serif; }
  .grid { columns: 2; column-gap: 6px; padding: 6px; }
  @media (min-width: 600px) { .grid { columns: 3; } }
  @media (min-width: 900px) { .grid { columns: 4; } }
  .card { break-inside: avoid; margin-bottom: 6px; border-radius: 6px; overflow: hidden; background: #1a1a1a; }
  .card img { width: 100%; display: block; opacity: 0; transition: 0.3s; cursor: pointer; }
  .card.loaded img { opacity: 1; }
  .lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; flex-direction: column; }
  .lb.open { display: flex; }
  .lb img { max-width: 100vw; max-height: 90vh; object-fit: contain; }
  .lb-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; }
  .lb-prev { left: 10px; } .lb-next { right: 10px; }
  .loader { text-align: center; padding: 50px; color: #888; }
</style>
</head>
<body>

<div id="loader" class="loader">Сканирую папку img...</div>
<div class="grid" id="grid" style="display:none;"></div>

<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext">›</button>
</div>

<script>
const grid = document.getElementById('grid');
const loader = document.getElementById('loader');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
let images = [];
let currentIndex = 0;

// Проверяем, есть ли картинка по пути
function checkImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function init() {
  let misses = 0;
  // Перебираем номера от 1 до 200
  for (let i = 1; i <= 200; i++) {
    let found = null;
    // Проверяем популярные форматы
    for (let ext of ['jpg', 'jpeg', 'png', 'webp']) {
      let url = `img/${i}.${ext}`;
      found = await checkImage(url);
      if (found) break;
    }

    if (found) {
      images.push(found);
      addCard(found, images.length - 1);
      misses = 0;
    } else {
      misses++;
      if (misses > 5) break; // Если 5 номеров подряд пустые — останавливаемся
    }
  }

  loader.style.display = 'none';
  if (images.length === 0) {
    loader.style.display = 'block';
    loader.innerHTML = 'Не нашел картинки.<br>Убедись, что они лежат в папке img и называются 1.jpg, 2.jpg...';
  } else {
    grid.style.display = 'block';
  }
}

function addCard(url, index) {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.src = url;
  img.loading = 'lazy';
  img.onload = () => card.classList.add('loaded');
  
  card.addEventListener('click', () => {
    currentIndex = index;
    openLb();
  });
  
  card.appendChild(img);
  grid.appendChild(card);
}

function openLb() {
  lbImg.src = images[currentIndex];
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function nav(dir) {
  currentIndex = (currentIndex + dir + images.length) % images.length;
  lbImg.src = images[currentIndex];
}

document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => nav(-1);
document.getElementById('lbNext').onclick = () => nav(1);
lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });

let touchStart = 0;
lb.addEventListener('touchstart', e => touchStart = e.touches[0].clientX, {passive: true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStart;
  if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1);
}, {passive: true});

init();
</script>
</body>
</html>
