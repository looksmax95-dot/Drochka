<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Art Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --surface: #121212;
    --text: #f5f5f5;
    --muted: #888888;
    --accent: #ff3366;
    --accent-glow: rgba(255, 51, 102, 0.3);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Скрываем скроллбар для чистоты (но скролл работает) */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

  /* --- Шапка --- */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 16px 20px;
    background: rgba(5, 5, 5, 0.7);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .header.hidden { transform: translateY(-100%); }
  .logo { font-weight: 900; font-size: 20px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .count { 
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text); background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  /* --- Сетка (Masonry) --- */
  .grid {
    column-count: 2;
    column-gap: 10px;
    padding: 76px 10px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (min-width: 600px) { .grid { column-count: 3; column-gap: 14px; } }
  @media (min-width: 900px) { .grid { column-count: 4; column-gap: 20px; padding: 100px 24px 60px; } }
  @media (min-width: 1400px) { .grid { column-count: 5; } }

  /* --- Карточка --- */
  .card {
    break-inside: avoid;
    margin-bottom: 10px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: zoom-in;
    background: var(--surface);
    
    /* Начальное состояние для анимации */
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    
    /* Скелетон */
    background-image: linear-gradient(110deg, #121212 8%, #2a2a2a 18%, #121212 33%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
  }
  @media (min-width: 900px) { .card { margin-bottom: 20px; border-radius: 14px; } }
  
  .card.in { opacity: 1; transform: none; }
  .card.loaded { animation: none; background: var(--surface); }
  
  @keyframes shimmer { to { background-position-x: -200%; } }

  .card img {
    width: 100%;
    display: block;
    opacity: 0;
    /* ЦВЕТОКОР: делаем картинки чуть контрастнее и сочнее */
    filter: contrast(1.05) saturate(1.1);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.3s ease;
  }
  .card.loaded img { opacity: 1; }
  
  /* Эффект при наведении (ПК) */
  @media (hover: hover) {
    .card:hover img { 
      transform: scale(1.03); 
      filter: contrast(1.1) saturate(1.25) brightness(1.05); /* Вспышка цвета при ховере */
    }
    .card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 30%);
      opacity: 0; transition: 0.3s;
    }
    .card:hover::after { opacity: 1; }
  }

  /* --- Статус / Ошибка --- */
  .status {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: var(--muted); font-size: 14px; width: 100%;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.05);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- Лайтбокс --- */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5, 5, 5, 0.98);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .lb.open { opacity: 1; pointer-events: auto; }

  .lb-top {
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    pointer-events: none; /* Чтобы кликать сквозь зону, кроме кнопок */
  }
  .lb-counter { 
    font-size: 14px; color: var(--text); font-weight: 600; letter-spacing: 1px; 
    pointer-events: auto; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .lb-actions { display: flex; gap: 12px; pointer-events: auto; }
  
  .btn-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: var(--text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    backdrop-filter: blur(10px);
  }
  .btn-icon:active { transform: scale(0.9); }
  .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-download { color: var(--accent); border-color: var(--accent-glow); background: rgba(255, 51, 102, 0.1); }

  .lb-stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: pan-y; /* Разрешаем скролл/свайп */
  }
  
  .lb-img-wrapper {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
    cursor: grab;
  }
  .lb-img-wrapper:active { cursor: grabbing; }
  .lb-img-wrapper.dragging { transition: none; } /* Отключаем анимацию при перетаскивании */

  .lb-img {
    max-width: 100%; max-height: 90vh; object-fit: contain;
    border-radius: 4px;
    /* Цветокор в лайтбоксе */
    filter: contrast(1.02) saturate(1.05);
    opacity: 0; transition: opacity 0.4s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .lb-img.loaded { opacity: 1; }

  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(20, 20, 20, 0.5); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; backdrop-filter: blur(10px); transition: 0.2s;
    z-index: 10; opacity: 0;
  }
  .lb:hover .lb-nav { opacity: 1; } /* Показываем стрелки только при наведении на ПК */
  
  @media (max-width: 768px) {
    .lb-nav { display: none; } /* На мобилках только свайпы, кнопки не нужны */
  }
  
  .lb-nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
  .lb-nav.prev { left: 20px; }
  .lb-nav.next { right: 20px; }

  /* Тост-уведомление */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 30px;
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px var(--accent-glow);
    opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="logo">GALLERY<span>.</span></div>
  <div class="count" id="imgCount">Загрузка...</div>
</div>

<div class="status" id="status">
  <div class="spinner"></div>
  Синхронизация...
</div>

<div class="grid" id="grid" style="display:none;"></div>

<!-- Лайтбокс -->
<div class="lb" id="lb">
  <div class="lb-top">
    <div class="lb-counter" id="lbCounter">1 / 1</div>
    <div class="lb-actions">
      <button class="btn-icon btn-download" id="lbDownload" title="Скачать оригинал">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="btn-icon" id="lbClose" title="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav prev" id="lbPrev"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    
    <div class="lb-img-wrapper" id="lbWrapper">
      <img class="lb-img" id="lbImg" alt="">
    </div>
    
    <button class="lb-nav next" id="lbNext"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div class="toast" id="toast">Ссылка скопирована</div>

<script>
const grid = document.getElementById('grid');
const status = document.getElementById('status');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbWrapper = document.getElementById('lbWrapper');
const lbCounter = document.getElementById('lbCounter');
const header = document.getElementById('header');
const toast = document.getElementById('toast');

let images = [];
let currentIndex = 0;
let lastScroll = 0;

// --- UX: Прячем шапку при скролле ---
window.addEventListener('scroll', () => {
  const currentScroll = window.pageYOffset;
  if (currentScroll > lastScroll && currentScroll > 100) {
    header.classList.add('hidden');
  } else {
    header.classList.remove('hidden');
  }
  lastScroll = currentScroll;
}, { passive: true });

// --- Анимации появления ---
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      // Добавляем задержку в зависимости от позиции, чтобы было волной
      const delay = (entry.target.dataset.index % 4) * 50;
      entry.target.style.transitionDelay = `${delay}ms`;
      
      entry.target.classList.add('in');
      observer.unobserve(entry.target);
    }
  });
}, { rootMargin: '100px' });

// --- Получение данных ---
async function init() {
  try {
    const hostname = location.hostname;
    if (!hostname.endsWith('.github.io')) throw new Error('Не GitHub Pages');
    
    const owner = hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0] || 'gallery';
    
    let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/img`;
    let response = await fetch(apiUrl);
    
    if (!response.ok) {
      apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
      response = await fetch(apiUrl);
    }
    
    const files = await response.json();
    const imgFiles = files
      .filter(f => f.type === 'file' && /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (imgFiles.length === 0) throw new Error('Пусто');

    images = imgFiles.map(f => f.download_url);
    
    document.getElementById('imgCount').textContent = `${images.length} артов`;
    status.style.display = 'none';
    grid.style.display = 'block';

    // --- Рендер карточек ---
    images.forEach((url, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;
      
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.onload = () => {
        card.classList.add('loaded');
        // Убираем дерганье сетки после загрузки
        card.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      };
      
      card.addEventListener('click', () => openLb(index));
      card.appendChild(img);
      grid.appendChild(card);
      observer.observe(card);
    });

  } catch (e) {
    status.innerHTML = `<div style="color:var(--accent); font-size: 40px; margin-bottom:10px;">⚠️</div> Ошибка синхронизации.`;
  }
}

// --- ЛОГИКА ЛАЙТБОКСА (Плавность + Предзагрузка) ---
function preloadImage(index) {
  if (index >= 0 && index < images.length) {
    const img = new Image();
    img.src = images[index];
  }
}

function openLb(index) {
  currentIndex = index;
  updateLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden'; // Блокируем фон
  
  // Сброс позиции, если было свайпнуто вниз
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';
}

function updateLb() {
  lbImg.classList.remove('loaded');
  lbImg.src = images[currentIndex];
  lbImg.onload = () => lbImg.classList.add('loaded');
  
  lbCounter.textContent = `${currentIndex + 1} / ${images.length}`;
  
  // Скачивание: открываем оригинал в новой вкладке
  document.getElementById('lbDownload').onclick = () => {
    window.open(images[currentIndex], '_blank');
  };
  
  // МАГИЯ ПЛАВНОСТИ: Предзагружаем соседние картинки
  preloadImage(currentIndex + 1);
  preloadImage(currentIndex - 1);
}

function navLb(dir) {
  currentIndex = (currentIndex + dir + images.length) % images.length;
  updateLb();
}

document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => navLb(-1);
document.getElementById('lbNext').onclick = () => navLb(1);

// --- СВАЙПЫ И ЖЕСТЫ (Как в нативном приложении) ---
let touchStartX = 0;
let touchStartY = 0;
let isDragging = false;

lb.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDragging = false;
  lbWrapper.classList.remove('dragging');
}, { passive: true });

lb.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;

  // Если тянем вниз (закрытие)
  if (dy > 0 && Math.abs(dy) > Math.abs(dx)) {
    isDragging = true;
    lbWrapper.classList.add('dragging');
    // Плавно сдвигаем и уменьшаем прозрачность
    const opacity = Math.max(0.2, 1 - dy / 300);
    lbWrapper.style.transform = `translateY(${dy}px) scale(${1 - dy / 1000})`;
    lbWrapper.style.opacity = opacity;
  }
}, { passive: true });

lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  
  lbWrapper.classList.remove('dragging');

  // Если тянули вниз и отпустили дальше 100px — закрываем
  if (isDragging && dy > 100) {
    closeLb();
    return;
  }

  // Сброс, если просто дернули
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';

  // Горизонтальный свайп (листание)
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    navLb(dx < 0 ? 1 : -1);
  }
}, { passive: true });

// Клик по пустому месту закрывает
lb.addEventListener('click', (e) => {
  if (e.target === lb || e.target.id === 'lbStage') closeLb();
});

// Клавиатура
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

init();
</script>
</body>
</html>
