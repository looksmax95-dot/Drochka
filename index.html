<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ART GALLERY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #121212;
    --text: #ffffff;
    --muted: #8a8a93;
    --accent: #ff3366;
    --accent-glow: rgba(255, 51, 102, 0.4);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Сетка --- */
  .grid {
    column-count: 2;
    column-gap: 8px;
    padding: 70px 8px 40px;
    max-width: 1600px;
    margin: 0 auto;
  }
  @media (min-width: 768px) { .grid { column-count: 3; column-gap: 12px; padding: 90px 16px 60px; } }
  @media (min-width: 1024px) { .grid { column-count: 4; column-gap: 16px; padding: 100px 24px 80px; } }

  /* --- Карточка --- */
  .card {
    break-inside: avoid;
    margin-bottom: 8px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    background: var(--surface);
    
    /* Анимация входа */
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    
    /* Скелетон */
    background-image: linear-gradient(110deg, #121212 8%, #1f1f28 18%, #121212 33%);
    background-size: 200% 100%;
    animation: shimmer 1.5s linear infinite;
  }
  @media (min-width: 768px) { .card { margin-bottom: 12px; border-radius: 14px; } }
  
  .card.in { opacity: 1; transform: none; }
  .card.loaded { animation: none; background: var(--surface); }
  
  /* Тактильный отклик при нажатии (для телефонов) */
  .card:active { transform: scale(0.96); transition: transform 0.1s ease; }
  
  @keyframes shimmer { to { background-position-x: -200%; } }

  .card img {
    width: 100%;
    display: block;
    opacity: 0;
    /* Цветокор: делаем картинки сочными и контрастными */
    filter: contrast(1.05) saturate(1.1);
    transition: opacity 0.5s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .card.loaded img { opacity: 1; }

  /* --- Шапка --- */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    display: flex; justify-content: space-between; align-items: center;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    pointer-events: none; /* Чтобы не блочить клики по краям */
  }
  .header > * { pointer-events: auto; }
  .header.hidden { transform: translateY(-100%); }
  .logo { font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .count { 
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text); background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;
  }

  /* --- ЛАЙТБОКС (Идеален для мобилок) --- */
  .lb {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; 
    transition: opacity 0.3s ease;
    height: 100dvh; /* Динамическая высота под мобильные браузеры */
  }
  .lb.open { opacity: 1; pointer-events: auto; }

  /* Верхняя панель управления */
  .lb-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: calc(16px + env(safe-area-inset-top)) 20px 16px; /* Отступ под вырез экрана */
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  
  /* Класс для скрытия интерфейса при тапе */
  .lb.ui-hidden .lb-top { opacity: 0; transform: translateY(-20px); pointer-events: none; }

  .lb-counter { font-size: 15px; font-weight: 800; letter-spacing: 1px; }
  .lb-actions { display: flex; gap: 12px; }
  
  .btn-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: none;
    color: var(--text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: 0.2s;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .btn-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
  .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-download { color: var(--accent); }

  /* Зона просмотра */
  .lb-stage {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  
  .lb-img-wrapper {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    will-change: transform, opacity; /* Для плавных свайпов */
  }

  .lb-img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    opacity: 0; 
    transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    user-select: none; -webkit-user-drag: none;
  }
  .lb-img.loaded { opacity: 1; }
  
  /* Зум по двойному тапу */
  .lb-img.zoomed { transform: scale(2.5); cursor: grab; }

  /* Тост */
  .toast {
    position: fixed; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 30px;
    font-weight: 800; font-size: 14px; box-shadow: 0 10px 30px var(--accent-glow);
    opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 300; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Шапка -->
<div class="header" id="header">
  <div class="logo">GALLERY<span>.</span></div>
  <div class="count" id="imgCount">Загрузка...</div>
</div>

<!-- Сетка -->
<div class="grid" id="grid"></div>

<!-- Лайтбокс -->
<div class="lb" id="lb">
  <div class="lb-top">
    <div class="lb-counter" id="lbCounter">1 / 1</div>
    <div class="lb-actions">
      <button class="btn-icon btn-download" id="lbDownload" title="Скачать">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <button class="btn-icon" id="lbClose" title="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  
  <div class="lb-stage" id="lbStage">
    <div class="lb-img-wrapper" id="lbWrapper">
      <img class="lb-img" id="lbImg" alt="">
    </div>
  </div>
</div>

<div class="toast" id="toast">Оригинал открыт в новой вкладке</div>

<script>
const grid = document.getElementById('grid');
const header = document.getElementById('header');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbWrapper = document.getElementById('lbWrapper');
const lbCounter = document.getElementById('lbCounter');
const toast = document.getElementById('toast');

let images = [];
let currentIndex = 0;
let lastScroll = 0;

// --- UX: Прячем шапку при скролле вниз ---
window.addEventListener('scroll', () => {
  const currentScroll = window.pageYOffset;
  if (currentScroll > lastScroll && currentScroll > 60) {
    header.classList.add('hidden');
  } else {
    header.classList.remove('hidden');
  }
  lastScroll = currentScroll;
}, { passive: true });

// --- Анимации появления карточек ---
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const delay = (entry.target.dataset.index % 4) * 60;
      entry.target.style.transitionDelay = `${delay}ms`;
      entry.target.classList.add('in');
      observer.unobserve(entry.target);
    }
  });
}, { rootMargin: '150px' });

// --- Загрузка данных ---
async function init() {
  try {
    const hostname = location.hostname;
    if (!hostname.endsWith('.github.io')) throw new Error('Не GitHub Pages');
    
    const owner = hostname.split('.')[0];
    const repo = location.pathname.split('/').filter(Boolean)[0] || 'gallery';
    
    let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/img`;
    let response = await fetch(apiUrl);
    
    if (!response.ok) {
      apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
      response = await fetch(apiUrl);
    }
    
    const files = await response.json();
    const imgFiles = files
      .filter(f => f.type === 'file' && /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name));

    if (imgFiles.length === 0) throw new Error('Пусто');

    images = imgFiles.map(f => f.download_url);
    document.getElementById('imgCount').textContent = `${images.length} артов`;

    // Рендер карточек
    images.forEach((url, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;
      
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.decoding = 'async';
      
      img.onload = () => {
        card.classList.add('loaded');
        card.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      };
      
      card.addEventListener('click', () => openLb(index));
      card.appendChild(img);
      grid.appendChild(card);
      observer.observe(card);
    });

  } catch (e) {
    document.getElementById('imgCount').textContent = 'Ошибка';
  }
}

// --- МОБИЛЬНЫЙ ЛАЙТБОКС (Свайпы + Зум) ---
function preloadImage(index) {
  if (index >= 0 && index < images.length) {
    const img = new Image();
    img.src = images[index];
  }
}

function openLb(index) {
  currentIndex = index;
  updateLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden'; // Блокируем фон
  
  // Сброс позиций
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';
  lbImg.classList.remove('zoomed');
  lb.classList.remove('ui-hidden');
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';
  lbImg.classList.remove('zoomed');
}

function updateLb() {
  lbImg.classList.remove('loaded');
  lbImg.classList.remove('zoomed'); // Сбрасываем зум при листании
  
  lbImg.src = images[currentIndex];
  lbImg.onload = () => lbImg.classList.add('loaded');
  
  lbCounter.textContent = `${currentIndex + 1} / ${images.length}`;
  
  // Скачивание
  document.getElementById('lbDownload').onclick = () => {
    window.open(images[currentIndex], '_blank');
    showToast();
  };
  
  // Предзагрузка
  preloadImage(currentIndex + 1);
  preloadImage(currentIndex - 1);
}

function navLb(dir) {
  currentIndex = (currentIndex + dir + images.length) % images.length;
  // Сбрасываем трансформации перед сменой
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';
  updateLb();
}

document.getElementById('lbClose').onclick = closeLb;

// --- СЕНСОРНОЕ УПРАВЛЕНИЕ (Swipe to dismiss, Tap to hide UI, Double Tap to zoom) ---
let touchStartX = 0;
let touchStartY = 0;
let isDragging = false;
let lastTapTime = 0;

lb.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDragging = false;
  lbWrapper.style.transition = 'none'; // Отключаем плавность на время перетаскивания
}, { passive: true });

lb.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;

  // Свайп вниз для закрытия (только если картинка не приближена)
  if (dy > 0 && Math.abs(dy) > Math.abs(dx) && !lbImg.classList.contains('zoomed')) {
    isDragging = true;
    const opacity = Math.max(0.1, 1 - dy / 250); // Плавно темнеет
    const scale = Math.max(0.85, 1 - dy / 1000); // Плавно уменьшается
    lbWrapper.style.transform = `translateY(${dy}px) scale(${scale})`;
    lbWrapper.style.opacity = opacity;
  }
}, { passive: true });

lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  
  lbWrapper.style.transition = ''; // Возвращаем CSS-плавность

  // Логика закрытия свайпом
  if (isDragging && dy > 100) {
    closeLb();
    return;
  }

  // Возврат на место
  lbWrapper.style.transform = '';
  lbWrapper.style.opacity = '';

  // Детектор тапов (если не свайпали)
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
    const now = Date.now();
    
    // Двойной тап (Зум)
    if (now - lastTapTime < 300) {
      lbImg.classList.toggle('zoomed');
      lastTapTime = 0; 
    } 
    // Одинарный тап (Скрыть/Показать интерфейс)
    else {
      lastTapTime = now;
      setTimeout(() => {
        if (lastTapTime !== 0) {
          lb.classList.toggle('ui-hidden');
          lastTapTime = 0;
        }
      }, 300);
    }
  }

  // Листание (Свайп влево/вправо)
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && !lbImg.classList.contains('zoomed')) {
    navLb(dx < 0 ? 1 : -1);
  }
}, { passive: true });

function showToast() {
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
